[package]
name = "plugover"
version = "0.3.0"
edition = "2024"
description = "Hands USB devices plugged into one machine to a punktfunk host over the network"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
mdns-sd = "0.21.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
spake2 = "0.4.0"
toml = "1.1.8"
