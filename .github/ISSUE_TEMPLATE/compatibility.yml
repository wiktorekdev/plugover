name: Compatibility report
description: Plugover works, or doesn't, on your systems or with your device
title: "Compatibility: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: Reports fill the compatibility tables in the README. Working setups are as useful as broken ones.
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Works with problems
        - Does not work
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugover version
      description: Output of `plugover --version`
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: relay
    attributes:
      label: Relay system
      description: Distribution or Windows version, and architecture
      placeholder: Raspberry Pi OS 12, ARM64
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host system
      placeholder: Windows 11 24H2, x86_64
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Devices
      description: The id and name of each device from `plugover status`, and what you tried (force feedback, pedals, buttons).
      placeholder: 046d:c24f Logitech G29, force feedback works
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that needed a workaround, or what went wrong. For a bug, a bug report with `plugover doctor --report` helps more.
