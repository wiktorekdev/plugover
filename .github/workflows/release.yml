name: Release

# Pushing a v* tag builds every release file. Signing and the draft release wait for approval in
# the `release` environment, the only place the signing key is available.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-zigbuild
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Without a key the script leaves SHA256SUMS unsigned; the sign job signs it.
      - run: scripts/build.sh
        env:
          PLUGOVER_SIGNING_KEY: /nonexistent
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Check and sign SHA256SUMS
        env:
          KEY: ${{ secrets.PLUGOVER_SIGNING_KEY }}
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          openssl pkeyutl -sign -inkey <(printf '%s\n' "$KEY") -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          openssl pkeyutl -verify -pubin -inkey packaging/release-key.pem -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/SHA256SUMS
      # A draft, so the notes get written before anyone is offered the update.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Plugover $version" --notes "" \
            dist/plugover* dist/installer.* dist/SHA256SUMS dist/SHA256SUMS.sig
