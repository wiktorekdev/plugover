name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test
      - name: Generated TypeScript types are committed
        run: |
          git status --porcelain plugin/ui/src/generated
          test -z "$(git status --porcelain plugin/ui/src/generated)" || { echo "commit what cargo test generated"; exit 1; }
      - run: cargo clippy --all-targets -- -D warnings
      # Checking needs no linker, so this covers the Windows-only code without a Windows runner.
      - run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      # Releases are musl builds, where some libc types differ from glibc (ioctl takes an int).
      - run: cargo clippy --all-targets --target x86_64-unknown-linux-musl -- -D warnings

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Versions match
        working-directory: .
        run: |
          rust=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          plugin=$(grep -m1 '"version"' plugin/package.json | cut -d'"' -f4)
          test "$rust" = "$plugin" || { echo "Cargo.toml $rust, plugin $plugin"; exit 1; }
